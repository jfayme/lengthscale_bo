# tests/ targets the pre-rewrite `lsab` package and no longer imports; it is
# kept only as a behavioural reference while the modules are rewritten by
# hand, and will go once they are. Notebooks are exploratory scratch space.
# Drop these two patterns as the new test suite lands.
exclude: |
  (?x)^(
    tests/.*|
    .*\.ipynb
  )$

repos:
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: [--config=pyproject.toml]
        pass_filenames: false

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.7.0
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
